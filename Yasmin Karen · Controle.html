<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yasmin Karen · Controle</title>
<style>
:root{--bg:#fff;--card:#fff;--tx:#000;--mut:#6b6b6b;--bd:#d9d9d9;--sf:#f4f4f4;--ac:#000;--acx:#fff;--in:#000;--out:#6b6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--card:#0d0d0d;--tx:#fff;--mut:#a3a3a3;--bd:#2e2e2e;--sf:#1a1a1a;--ac:#fff;--acx:#000;--in:#fff;--out:#a3a3a3;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#000;--card:#0d0d0d;--tx:#fff;--mut:#a3a3a3;--bd:#2e2e2e;--sf:#1a1a1a;--ac:#fff;--acx:#000;--in:#fff;--out:#a3a3a3;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.w{max-width:560px;margin:0 auto;padding:20px 16px 40px}
.top{text-align:center;margin-bottom:16px}
.logo{display:inline-grid;place-items:center;width:44px;height:44px;border:1px solid var(--tx);border-radius:50%;font:600 16px Georgia,serif;margin-bottom:6px}
h1{font:500 26px Georgia,"Times New Roman",serif;margin:0}
.sub{color:var(--mut);font-size:14px}
h2{font:600 12px system-ui,sans-serif;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin:0 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px;margin-bottom:14px}
.mes{display:grid;grid-template-columns:44px 1fr 44px;gap:8px;margin-bottom:12px}
.k{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.k div{background:var(--sf);border-radius:14px;padding:12px 8px;text-align:center}
.k small{color:var(--mut);display:block;font-size:12px}
.k b{font-size:16px}
.k .big{background:var(--ac);color:var(--acx)}
.k .big small{color:inherit;opacity:.7}
input,button{font:inherit;width:100%;padding:12px;border-radius:12px;border:1px solid var(--bd);background:var(--card);color:var(--tx)}
button{cursor:pointer;background:var(--ac);color:var(--acx);border:0;font-weight:600}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
.seg button,.mes button{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}
.seg button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
.sec{margin-bottom:14px}
.g{font-size:13px;color:var(--mut);margin:8px 0 6px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chips button{width:auto;padding:8px 12px;font-weight:400;font-size:14px;background:var(--card);color:var(--tx);border:1px solid var(--bd);border-radius:999px}
.chips button.on{background:var(--ac);color:var(--acx);border-color:var(--ac);font-weight:600}
.sum{font-size:14px;color:var(--mut);margin-top:8px}
.r2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px}
.day{display:flex;justify-content:space-between;font-size:13px;color:var(--mut);padding:12px 0 6px;border-bottom:1px solid var(--bd);text-transform:capitalize}
.day:first-child{padding-top:0}
.it{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0}
.it div:first-child{min-width:0}
.it b{white-space:nowrap}
.x{width:auto;background:none;color:var(--mut);padding:2px 6px;font-weight:400;border:0}
.empty{color:var(--mut);text-align:center;padding:10px}
.lnk{background:none;color:var(--mut);font-weight:400;font-size:14px;text-decoration:underline;border:0}
</style>
</head>
<body>
<div class="w">
  <div class="top"><div class="logo">YK</div><h1>Yasmin Karen</h1><div class="sub">Controle financeiro · uso privado</div></div>

  <div class="mes"><button id="pv" aria-label="Mês anterior">‹</button><input type="month" id="mes"><button id="nx" aria-label="Próximo mês">›</button></div>
  <div class="k" id="kpi"></div>

  <div class="card">
    <h2>Novo lançamento</h2>
    <div class="seg"><button id="bE" class="on">Entrada</button><button id="bS">Saída</button></div>

    <div class="sec" id="svs">
      <div id="serv"></div>
      <div class="sum" id="sum"></div>
    </div>

    <div class="sec">
      <input id="desc" placeholder="Nome da cliente (opcional)">
      <div class="r2">
        <input id="val" type="number" inputmode="decimal" step="0.01" placeholder="Valor (R$)">
        <input id="dt" type="date">
      </div>
    </div>
    <button id="add">Salvar</button>
  </div>

  <div class="card"><h2>Lançamentos</h2><div id="list"></div></div>
  <div style="text-align:center"><button class="lnk" id="exp">Baixar planilha (CSV)</button></div>
</div>

<script>
var KEY='yk_fin_v2',S,tipo='e',sel=[];
var SV=[
['Design personalizado',25,'Sobrancelhas'],['Design com henna',30,'Sobrancelhas'],['Brow lamination',95,'Sobrancelhas'],
['Volume brasileiro',100,'Cílios'],['Volume 4D',0,'Cílios'],['Volume 4D marrom',100,'Cílios'],['Volume 5D',110,'Cílios'],['Volume 5D marrom',110,'Cílios'],['Efeito fox',120,'Cílios'],['Efeito sirena',110,'Cílios'],['Lash lifting',95,'Cílios'],
['SPA labial',30,'Lábios']];
var GR=['Sobrancelhas','Cílios','Lábios'];
var $=function(i){return document.getElementById(i)};
function load(){var o=null;try{o=JSON.parse(localStorage.getItem(KEY))}catch(e){}S=o&&o.tx?o:{tx:[]}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function brl(v){return v.toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
function today(){var d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dlabel(s){return new Date(s+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'2-digit'})}

function drawServ(){
  $('serv').innerHTML=GR.map(function(g){
    return'<div class="g">'+g+'</div><div class="chips">'+SV.map(function(s,i){return s[2]!=g?'':'<button type="button" data-s="'+i+'" class="'+(sel.indexOf(i)>-1?'on':'')+'">'+s[0]+(s[1]?' · R$ '+s[1]:'')+'</button>'}).join('')+'</div>'}).join('');
  $('sum').textContent=sel.length?sel.length+(sel.length>1?' serviços':' serviço')+' selecionado'+(sel.length>1?'s':''):'Toque para escolher um ou mais serviços';
}
$('serv').onclick=function(ev){var b=ev.target.closest('[data-s]');if(!b)return;var i=+b.getAttribute('data-s'),p=sel.indexOf(i);
  if(p>-1)sel.splice(p,1);else sel.push(i);
  var t=0;sel.forEach(function(k){t+=SV[k][1]});$('val').value=t?t:'';drawServ()};

function setTipo(t){tipo=t;
  $('bE').className=t=='e'?'on':'';$('bS').className=t=='s'?'on':'';
  $('svs').style.display=t=='e'?'':'none';
  $('desc').placeholder=t=='e'?'Nome da cliente (opcional)':'O que foi? (ex: cola, cílios)';}
$('bE').onclick=function(){setTipo('e')};
$('bS').onclick=function(){setTipo('s')};
$('mes').onchange=render;
function mv(n){var p=$('mes').value.split('-'),d=new Date(+p[0],+p[1]-1+n,1);$('mes').value=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0');render()}
$('pv').onclick=function(){mv(-1)};$('nx').onclick=function(){mv(1)};

$('add').onclick=function(){
  var v=parseFloat($('val').value);
  if(!v||v<=0){$('val').focus();return}
  var d=$('desc').value.trim();
  if(tipo=='e'){var n=sel.length?sel.map(function(k){return SV[k][0]}).join(' + '):'Serviço';d=d?n+' · '+d:n}
  else if(!d)d='Reposição';
  S.tx.push({id:Date.now(),t:tipo,d:d,v:v,dt:$('dt').value||today()});
  save();$('desc').value='';$('val').value='';sel=[];drawServ();
  var m=($('dt').value||today()).slice(0,7);if(m!=$('mes').value)$('mes').value=m;render();};

function render(){
  var m=$('mes').value;
  var tx=S.tx.filter(function(x){return x.dt.slice(0,7)==m}).sort(function(a,b){return b.dt.localeCompare(a.dt)||b.id-a.id});
  var e=0,s=0;tx.forEach(function(x){x.t=='e'?e+=x.v:s+=x.v});
  $('kpi').innerHTML='<div><small>Entrou</small><b>'+brl(e)+'</b></div><div><small>Saiu</small><b>'+brl(s)+'</b></div><div class="big"><small>Sobrou</small><b>'+brl(e-s)+'</b></div>';
  var days=[],map={};tx.forEach(function(x){if(!map[x.dt]){map[x.dt]=[];days.push(x.dt)}map[x.dt].push(x)});
  $('list').innerHTML=days.length?days.map(function(d){
    var tot=0;map[d].forEach(function(x){tot+=x.t=='e'?x.v:-x.v});
    return'<div class="day"><span>'+dlabel(d)+'</span><span>'+(tot<0?'−':'')+brl(Math.abs(tot))+'</span></div>'+map[d].map(function(x){return'<div class="it"><div>'+esc(x.d)+'</div><div style="display:flex;align-items:center;gap:4px"><b class="'+(x.t=='e'?'in':'out')+'">'+(x.t=='e'?'+':'−')+brl(x.v)+'</b><button class="x" data-del="'+x.id+'" aria-label="Excluir">✕</button></div></div>'}).join('')}).join(''):'<div class="empty">Nenhum lançamento neste mês</div>';
}
document.addEventListener('click',function(ev){
  var d=ev.target.getAttribute&&ev.target.getAttribute('data-del');
  if(d&&confirm('Excluir este lançamento?')){S.tx=S.tx.filter(function(x){return x.id!=d});save();render()}
});
$('exp').onclick=function(){
  var r=['Data;Tipo;Descrição;Valor'].concat(S.tx.map(function(x){return[x.dt,x.t=='e'?'Entrada':'Saída','"'+x.d.replace(/"/g,'""')+'"',x.v.toFixed(2).replace('.',',')].join(';')}));
  var a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+r.join('\n')],{type:'text/csv'}));a.download='financeiro-'+today()+'.csv';a.click();};

load();$('mes').value=today().slice(0,7);$('dt').value=today();setTipo('e');drawServ();render();
</script>
</body>
</html>
